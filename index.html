<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pediatric ER Companion</title>
<!--

<meta name="description" content="Pediatric ER Companion — weight-based emergency protocols and doses for children, aligned to IAP STG, WHO and AHA PALS.">
<meta name="theme-color" content="#0B6E4F">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Day (default) */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#101828; --muted:#475467; --line:#E4E7EC; --soft:#F2F4F7;
  --accent:#0B6E4F; --alarm:#B42318; --alarm-bg:#FEF0EE; --steady:#1B6E7A; --steady-bg:#E4F2F4;
  --bw:1px; --fs:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Night: follows the viewer until a theme is picked */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-app-theme]){
    --paper:#0F1B2D; --surface:#182A44; --ink:#E8EEF6; --muted:#93A3B8; --line:#243757; --soft:#12223A;
    --accent:#4FC1CC; --alarm:#F2877E; --alarm-bg:#3A1E23; --steady:#5FC3CF; --steady-bg:#12343B;
  }
}
:root[data-theme="dark"]:not([data-app-theme]),
:root[data-app-theme="night"]{
  --paper:#0F1B2D; --surface:#182A44; --ink:#E8EEF6; --muted:#93A3B8; --line:#243757; --soft:#12223A;
  --accent:#4FC1CC; --alarm:#F2877E; --alarm-bg:#3A1E23; --steady:#5FC3CF; --steady-bg:#12343B;
}
:root[data-app-theme="day"]{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#101828; --muted:#475467; --line:#E4E7EC; --soft:#F2F4F7;
  --accent:#0B6E4F; --alarm:#B42318; --alarm-bg:#FEF0EE; --steady:#1B6E7A; --steady-bg:#E4F2F4;
}
/* Bright: sunlight / high contrast */
:root[data-app-theme="bright"]{
  --paper:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#1F1F1F; --line:#000000; --soft:#F0F0F0;
  --accent:#0033CC; --alarm:#A30000; --alarm-bg:#FFE9E9; --steady:#00463B; --steady-bg:#E3F5F0;
  --bw:2px; --fs:18.5px;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs);line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
  border-bottom:3px solid var(--accent);padding:10px 16px 12px}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--accent);margin-right:auto;font-size:16px}
.seg{display:flex;border:var(--bw) solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;padding:0 10px;border:0;background:transparent;font-size:14px;display:flex;align-items:center;gap:5px}
.seg button+button{border-left:var(--bw) solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.voice{min-height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.voice[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.row2{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.wt{display:flex;align-items:baseline;gap:6px;flex:1 1 200px;min-height:52px;padding:4px 14px;border-radius:12px;background:var(--soft);border:var(--bw) solid var(--line)}
.wt span.l{font-size:14px;color:var(--muted)}
#w{width:3.2em;font-weight:700;font-size:32px;border:0;background:transparent;padding:0;text-align:right}
.wt b{font-size:18px}
.est{display:flex;gap:6px;align-items:center}
.est select{min-height:44px;padding:0 6px;border:var(--bw) solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.est button{min-height:44px;padding:0 12px;border-radius:10px;border:0;background:var(--ink);color:var(--paper);font-size:14px;font-weight:700}
.vstat{margin-top:8px;font-size:14px;color:var(--muted);display:none}
.vstat.on{display:block}
.vstat strong{color:var(--ink)}

/* Home */
main{padding:14px 16px 48px}
.search{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.search input{flex:1;border:0;background:transparent;font-size:18px;min-width:0}
.search input:focus-visible{outline:none}
h2.sub{font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--surface);font-weight:700;font-size:15px}
.band{background:var(--surface);border-radius:12px;overflow:hidden;margin-top:12px;border:var(--bw) solid var(--line)}
.band h3{margin:0;padding:7px 14px;font-size:14px;color:#FFFFFF;display:flex;justify-content:space-between}
.band h3 span{font-weight:400;opacity:.9}
.row{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;border:0;border-top:var(--bw) solid var(--line);background:transparent;text-align:left;font-size:17px}
.band h3+.row{border-top:0}
.row small{font-size:13px;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}

/* Protocol */
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back,.pin{min-height:44px;padding:0 12px;border-radius:10px;border:var(--bw) solid var(--line);background:var(--surface);font-size:15px}
.pin[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.tag{display:inline-block;margin-top:14px;padding:2px 10px;border-radius:999px;color:#FFFFFF;font-size:13px;font-weight:700}
h1{font-size:28px;line-height:1.15;margin:6px 0 4px}
.src{color:var(--muted);font-size:14px;margin:0 0 14px}
.phase{display:grid;grid-template-columns:96px 1fr;gap:0 16px;border-top:var(--bw) solid var(--line);padding:14px 0}
.time{font-weight:700;color:var(--alarm);font-size:15px;padding-top:3px}
.phase h2{font-size:19px;margin:0 0 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.say{flex:none;min-height:36px;padding:0 10px;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:700}
.phase.speaking{background:var(--steady-bg);border-radius:8px}
.phase ul{margin:0;padding-left:18px}
.phase li{margin:3px 0;max-width:68ch}
.dose{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--steady-bg);border-left:4px solid var(--steady);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0;max-width:68ch}
.dose .drug{font-weight:700}
.dose .calc{font-weight:700;font-size:20px;text-align:right;color:var(--steady);white-space:nowrap}
.dose .rule,.dose .note{font-size:14px;color:var(--muted)}
.dose .capped{color:var(--alarm);font-size:13px;font-weight:700;text-align:right}
.recipe{background:var(--surface);border:1.5px dashed var(--steady);border-radius:8px;padding:8px 12px;margin:8px 0;max-width:68ch;font-size:15px}
.warn{background:var(--alarm-bg);border-left:4px solid var(--alarm);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0;max-width:68ch;font-size:15px}
.foot{margin-top:28px;font-size:13px;color:var(--muted);max-width:68ch}
[hidden]{display:none!important}
.brand,h1,.phase h2,.band h3,.time,#w,.dose .calc,.chip,.placeholder strong,h2.sub{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
.brand{font-weight:800;letter-spacing:-0.01em;font-size:17px}
h1{font-weight:800;letter-spacing:-0.02em}
.phase h2{font-weight:700;letter-spacing:-0.01em}
.band h3{font-weight:700;font-size:15px}
#w{font-weight:800}
.dose .calc{font-weight:800}
.time{font-weight:700}
.chip{font-weight:600}
.refs{margin-top:24px;padding-top:14px;border-top:2px solid var(--ink);max-width:68ch}
.refs h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;font-size:18px;margin:0 0 8px}
.refs ol{margin:0;padding-left:20px}
.refs li{margin:6px 0;font-size:15px}
.refs a{color:var(--accent);font-weight:600;text-underline-offset:3px}
.refs small{display:block;color:var(--muted);font-size:13px}
.bands{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.bands .band{margin-top:0}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:50vh;color:var(--muted);gap:6px;padding:24px}
.placeholder strong{color:var(--ink);font-size:20px}
.homefoot{margin:28px 0 0;font-size:13px;color:var(--muted)}
.homefoot a{color:var(--accent);font-weight:600;text-underline-offset:3px}

/* Tablet portrait */
@media (min-width:700px){
  .wrap{max-width:980px}
  .bands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .phase{grid-template-columns:120px 1fr}
  .dose .calc{font-size:22px}
  h1{font-size:32px}
}

/* Tablet landscape: list on the left, protocol on the right */
body.split .bar .wrap, body.split main.wrap{max-width:1440px}
body.split main{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:28px;align-items:start}
body.split #home{position:sticky;top:var(--barH,140px);max-height:calc(100vh - var(--barH,140px));overflow-y:auto;padding:0 6px 24px 0;overscroll-behavior:contain}
body.split .bands{grid-template-columns:1fr}
body.split .back{visibility:hidden}
body.split #proto{border-left:var(--bw) solid var(--line);padding-left:28px;min-height:70vh}
.row[aria-current="true"]{background:var(--steady-bg);font-weight:700;box-shadow:inset 4px 0 0 var(--steady)}
@media (max-width:560px){
  .phase{grid-template-columns:1fr}
  .time{padding:0 0 2px}
  h1{font-size:24px}
  .seg button span{display:none}
}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="row1">
    <div class="brand">Pediatric ER Companion</div>
    <div class="seg" role="group" aria-label="Display theme">
      <button data-set-theme="night" aria-pressed="false" title="Night"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Night</span></button>
      <button data-set-theme="day" aria-pressed="false" title="Day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Day</span></button>
      <button data-set-theme="bright" aria-pressed="false" title="Bright"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg><span>Bright</span></button>
    </div>
    <button class="voice" id="voiceBtn" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg><span id="voiceLbl">Voice off</span></button>
  </div>
  <div class="row2">
    <label class="wt"><span class="l">Weight</span><input id="w" type="number" inputmode="decimal" min="0.5" max="150" step="0.1" placeholder="--" aria-label="Weight in kg"><b>kg</b></label>
    <div class="est">
      <select id="age" aria-label="Age for weight estimate"><option value="">Age</option></select>
      <button id="useEst" type="button">Use age</button>
    </div>
  </div>
  <div class="vstat" id="vstat" aria-live="polite"></div>
</div></header>

<main class="wrap">
  <section id="home">
    <label class="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="What are you treating?" aria-label="Search conditions or symptoms" autocomplete="off"></label>
    <div id="homeList"></div>
    <p class="homefoot">For trained clinicians. Verify doses against the current IAP STG and your unit protocol.<br>
      Pediatric ER Companion <span class="vbadge">v1.0.1</span> · created by Dr Vignesh N · <a href="https://cbc.pediaos.com/">Code Blue Companion</a></p>
  </section>
  <section id="proto" hidden></section>
</main>

<script>
const P = [
{ id:"se", name:"Status epilepticus", src:"Aligned to IAP STG / AES 2016 staged approach",
  phases:[
  {t:"0–5 min", h:"Stabilise", items:[
    "Airway, O₂, suction, recovery position. Monitor SpO₂, HR.",
    "IV/IO access; send glucose, electrolytes, Ca, Mg; AED levels if on treatment.",
    {d:"10% dextrose (if glucose <60 mg/dL)", per:2, u:"ml", r:"IV"}
  ]},
  {t:"5–20 min", h:"First line: benzodiazepine", items:[
    {d:"Lorazepam", per:0.1, u:"mg", max:4, r:"IV"},
    {d:"Midazolam", per:0.2, u:"mg", max:10, r:"IV / IM"},
    {d:"Midazolam", per:0.3, u:"mg", max:10, r:"Intranasal / buccal", n:"When no IV access"},
    {d:"Diazepam", per:0.3, u:"mg", max:10, r:"IV (0.5 mg/kg PR, max 20)"},
    "Repeat benzodiazepine once after 5–10 min if still seizing. Max two doses including pre-hospital."
  ]},
  {t:"20–40 min", h:"Second line: pick one", items:[
    {d:"Levetiracetam", per:[40,60], u:"mg", max:4500, r:"IV over 10–15 min"},
    {d:"Fosphenytoin", per:20, u:"mg PE", max:1500, r:"IV at ≤3 mg PE/kg/min"},
    {d:"Phenytoin", per:20, u:"mg", max:1500, r:"IV in NS at ≤1 mg/kg/min", n:"Cardiac monitor; watch for bradycardia, hypotension"},
    {d:"Valproate", per:[20,40], u:"mg", max:3000, r:"IV over 10 min", n:"Avoid <2 y, liver disease, suspected metabolic disorder"},
    {d:"Phenobarbitone", per:20, u:"mg", max:1000, r:"IV over 20 min", n:"Watch respiratory depression"}
  ]},
  {t:">40 min", h:"Refractory: shift to PICU", items:[
    "Secure airway, intubate, continuous EEG if available.",
    {d:"Midazolam bolus", per:0.2, u:"mg", max:10, r:"IV, then infusion"},
    {rec:w=>`Midazolam infusion: ${f(3*w)} mg in 50 ml NS → 1 ml/h = 1 µg/kg/min. Start 1–2, titrate up to 24 µg/kg/min.`}
  ]}
]},
{ id:"ana", name:"Anaphylaxis", src:"Aligned to IAP STG / WAO guidance",
  phases:[
  {t:"Immediately", h:"Adrenaline IM first", items:[
    {d:"Adrenaline 1 mg/ml (1:1000)", per:0.01, u:"mg", max:0.5, r:"IM, anterolateral thigh", c:1, n:"Repeat every 5 min if no improvement"},
    {warn:"Do not delay adrenaline for antihistamines or steroids. Never give 1 mg/ml IV."},
    "Remove trigger. Lie flat with legs raised (sit up if breathless). High-flow O₂."
  ]},
  {t:"Next 5–15 min", h:"Support circulation and airway", items:[
    {d:"NS bolus (if hypotension / poor perfusion)", per:20, u:"ml", r:"IV/IO, repeat as needed"},
    {d:"Salbutamol neb", fixed:"2.5 mg (<5 y) / 5 mg (≥5 y)", r:"Neb, for bronchospasm"},
    "Stridor: nebulised adrenaline 1 mg/ml, 0.5 ml/kg (max 5 ml)."
  ]},
  {t:"After 2 IM doses", h:"Refractory anaphylaxis", items:[
    {rec:w=>`Adrenaline infusion: ${f(0.3*w)} mg in 50 ml NS → 1 ml/h = 0.1 µg/kg/min. Range 0.1–1 µg/kg/min.`},
    "Call PICU / anaesthesia early for airway."
  ]},
  {t:"Once stable", h:"Adjuncts and disposal", items:[
    {d:"Hydrocortisone", per:4, u:"mg", max:200, r:"IV", n:"Adjunct only"},
    {d:"Cetirizine", fixed:"2.5 mg (6 m–2 y) / 5 mg (2–6 y) / 10 mg (>6 y)", r:"Oral, for skin symptoms"},
    "Observe at least 6 h (longer if severe or needed >1 dose). Discharge with adrenaline plan and allergy referral."
  ]}
]},
{ id:"dka", name:"DKA", src:"Aligned to ISPAD 2022 / IAP STG",
  phases:[
  {t:"Hour 0", h:"Confirm and assess", items:[
    "Glucose >200 mg/dL, pH <7.3 or HCO₃ <18, ketonaemia / ketonuria.",
    "Severity: mild pH <7.3, moderate <7.2, severe <7.1. Weigh; assess dehydration, GCS.",
    "Send VBG, electrolytes, urea, creatinine, CBC; hourly glucose, ECG for K."
  ]},
  {t:"Hour 0–1", h:"Fluids", items:[
    {d:"NS bolus", per:[10,20], u:"ml", r:"IV over 20–30 min", n:"In shock: 20 ml/kg rapidly, reassess"},

  ]},
  {t:"Hour 1–2", h:"Insulin and potassium", items:[

    {rec:w=>`Insulin: 50 U in 50 ml NS (1 U/ml) → run at ${f(0.05*w)}–${f(0.1*w)} ml/h.`},
    "Potassium: add 40 mmol/L to fluids once K <5.5 and passing urine. If K low at start, give K before insulin.",
    "Add 5% dextrose when glucose falls below 250–300 mg/dL. Aim fall ≤90 mg/dL/h."
  ]},
  {t:"Any time", h:"Cerebral oedema", items:[
    {warn:"Headache, falling HR, rising BP, falling GCS, agitation → treat immediately, don't wait for imaging."},

]},
{ id:"ss", name:"Septic shock", src:"Aligned to IAP STG / Surviving Sepsis Campaign Pediatrics 2020",
  phases:[
  {t:"0–5 min", h:"Recognise and access", items:[
    "O₂, monitor, IV/IO ×2. Send blood culture, glucose, lactate, VBG, CBC, CRP.",
    {d:"10% dextrose (if glucose <60 mg/dL)", per:2, u:"ml", r:"IV"}
  ]},
  {t:"5–60 min", h:"Fluids and antibiotics", items:[
    {d:"Crystalloid bolus (RL / NS)", per:[10,20], u:"ml", r:"IV over 5–20 min", n:"Reassess after each: liver span, crepts, HR, CRT"},

  ]},
  {t:"Fluid refractory", h:"Vasoactives (peripheral OK, dilute)", items:[

    "Consider intubation with ketamine; avoid etomidate."
  ]},
  {t:"Catecholamine resistant", h:"Steroids", items:[
    {d:"Hydrocortisone", per:[1,2], u:"mg", max:100, r:"IV every 6 h", n:"Or 50 mg/m²/day"},
    "Correct Ca, glucose. Echo if available. Shift to PICU."
  ]}
]},
{ id:"den", name:"Dengue shock", src:"Aligned to WHO 2012 / NVBDCP / IAP dengue guidance",
  phases:[
  {t:"Triage", h:"Classify and baseline", items:[
    "Warning signs: abdominal pain, persistent vomiting, fluid accumulation, mucosal bleed, lethargy/restlessness, liver >2 cm, rising Hct with falling platelets.",
    "Baseline Hct before fluids. Use ideal body weight in obese children.",
    {d:"Paracetamol (fever)", per:15, u:"mg", max:1000, r:"Oral, 6-hourly", n:"No NSAIDs, no IM injections, no steroids"}
  ]},
  {t:"Warning signs, no shock", h:"Graded crystalloid", items:[
    {d:"Crystalloid", per:[5,7], u:"ml/h", r:"IV for 1–2 h"},
    {rec:w=>`Then ${f(3*w)}–${f(5*w)} ml/h for 2–4 h, then ${f(2*w)}–${f(3*w)} ml/h. Taper as Hct and urine output settle (target UO 1 ml/kg/h).`}
  ]},

function hs(w){ return w<=10 ? 4*w : w<=20 ? 40+2*(w-10) : Math.min(60+(w-20),100); }
function etts(w){
  if(w<3) return `ETT 2.5–3.0 uncuffed (neonate). Depth ≈ weight + 6 cm at lip.`;
  if(w<10) return `ETT cuffed 3.0–3.5 (infant). Depth ≈ 3 × tube size = ${f(9)}–${f(10.5)} cm. Size estimated from weight; confirm by age.`;
  const age = w<=18 ? (w-8)/2 : (w-7)/3;
  const cuf = Math.round((age/4+3.5)*2)/2;
  return `ETT cuffed ${cuf.toFixed(1)} (have ${(cuf-0.5).toFixed(1)} and ${(cuf+0.5).toFixed(1)} ready). Depth ≈ ${f(cuf*3)} cm at lip. Estimated age ~${Math.max(1,Math.round(age))} y from weight; confirm by age.`;
}

/* ---------- dose logic ---------- */
function doseCalc(it){
  if(it.fixed) return {calc:"", rule:it.fixed, cap:false};
  const lo = Array.isArray(it.per)?it.per[0]:it.per, hi = Array.isArray(it.per)?it.per[1]:null;
  const rule = `${hi?lo+"–"+hi:lo} ${it.u}/kg${it.min?` · min ${f(it.min)}`:""}${it.max?` · max ${f(it.max)} ${it.u}`:""}`;
  if(!W) return {calc:"enter wt", rule, cap:false, noW:true};
  let a=lo*W, b=hi?hi*W:null, cap=false;
  if(it.min){ if(a<it.min)a=it.min; if(b&&b<it.min)b=it.min; }
  if(it.max){ if(a>it.max){a=it.max;cap=true} if(b&&b>it.max){b=it.max;cap=true} }
  let calc = `${f(a)}${b&&b!==a?"–"+f(b):""} ${it.u}`;
  if(it.c && !hi) calc += ` = ${f(a/it.c)} ml`;
  return {calc, rule, cap};
}
function doseHTML(it){
  const d = doseCalc(it);
  return `<div class="dose"><span class="drug">${it.d}</span><span class="calc">${d.calc}</span>
    <span class="rule">${d.rule} · ${it.r}</span><span class="capped">${d.cap?"capped at max":""}</span>
    ${it.n?`<span class="note" style="grid-column:1/-1">${it.n}</span>`:""}</div>`;
}
function itemHTML(it){
  if(typeof it==="string") return `<li>${it}</li>`;
  if(it.warn) return `</ul><div class="warn">${it.warn}</div><ul>`;
  if(it.rec) return `</ul><div class="recipe">${W?it.rec(W):"Enter weight to calculate."}</div><ul>`;
  return `</ul>${doseHTML(it)}<ul>`;
}

/* ---------- home ---------- */
const chev = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
function matches(q){
  q=q.trim().toLowerCase(); if(!q) return null;
  return P.filter(p=>p.name.toLowerCase().includes(q) || KW[p.id].some(k=>k.startsWith(q)||q.includes(k)));
}
function renderHome(){
  const m = matches($("#q").value);
  let h="";
  if(m){
    h += `<h2 class="sub">${m.length?"Matches":"No match"}</h2>`;
    if(!m.length) h += `<div class="empty">Try a symptom, like seizure, wheeze or snake.</div>`;
    else h += `<div class="band">${m.map(p=>`<button class="row" data-open="${p.id}"${p.id===cur?' aria-current="true"':''}>${p.name}<small>${groupOf(p.id).name}</small></button>`).join("")}</div>`;
  } else {
    if(pins.length) h += `<h2 class="sub">Pinned</h2><div class="chips">${pins.filter(byId).map(id=>`<button class="chip" data-open="${id}">${byId(id).name}</button>`).join("")}</div>`;
    h += `<h2 class="sub">Browse by system</h2>`;
    h += `<div class="bands">` + G.map(g=>`<div class="band"><h3 style="background:${g.c}">${esc(g.name)}<span>${g.ids.length}</span></h3>${g.ids.map(id=>`<button class="row" data-open="${id}"${id===cur?' aria-current="true"':''}>${byId(id).name}<span aria-hidden="true">${chev}</span></button>`).join("")}</div>`).join("") + `</div>`;
  }
  $("#homeList").innerHTML = h;
}

/* ---------- protocol ---------- */
function renderProto(){
  const p = byId(cur), g = groupOf(cur), pinned = pins.includes(cur);
  $("#proto").innerHTML = `<div class="phead"><button class="back" data-home>← All conditions</button>
    <button class="pin" data-pin aria-pressed="${pinned}">${pinned?"Pinned":"Pin"}</button></div>
    <span class="tag" style="background:${g.c}">${esc(g.name)}</span>
    <h1>${p.name}</h1><p class="src">${p.src}</p>` +
    p.phases.map((ph,i)=>`<section class="phase${voiceOn&&i===speakIdx&&speaking?" speaking":""}"><div class="time">${ph.t}</div><div><h2>${ph.h}${voiceOn?`<button class="say" data-say="${i}">Read aloud</button>`:""}</h2><ul>${ph.items.map(itemHTML).join("")}</ul></div></section>`).join("").replace(/<ul><\/ul>/g,"") +
    `<section class="refs"><h2>References</h2><ol>${(REFS[cur]||[]).map(r=>`<li><a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a><small>${esc(r.s)}</small></li>`).join("")}</ol></section>` +
    `<p class="foot">Quick reference for trained clinicians. Doses are calculated from the weight entered and capped at adult maximums. Verify against the current IAP Standard Treatment Guidelines and your unit protocol before giving.</p>`;
}
const splitMQ = matchMedia("(min-width: 900px) and (orientation: landscape), (min-width: 1200px)");
function isSplit(){ return splitMQ.matches; }
function placeholder(){
  $("#proto").innerHTML = `<div class="placeholder"><strong>Pick a condition</strong><span>Choose from the list, search a symptom, or turn voice on and say “open DKA”.</span></div>`;
}
function show(v){
  const split = isSplit();
  document.body.classList.toggle("split", split);
  $("#home").hidden = !split && v!=="home";
  $("#proto").hidden = !split && v!=="proto";
  renderHome();
  if(cur) renderProto(); else if(split) placeholder();
  window.scrollTo({top:0});
}
function setBarH(){ document.documentElement.style.setProperty("--barH", $(".bar").offsetHeight+"px"); }
splitMQ.addEventListener("change",()=>{ setBarH(); show(cur?"proto":"home"); });
addEventListener("resize", setBarH);
function openP(id){ cur=id; speakIdx=0; show("proto"); }
function goHome(){ cur=null; stopSpeech(); show("home"); }

/* ---------- theme ---------- */
function applyTheme(){
  if(theme) document.documentElement.setAttribute("data-app-theme",theme);
  else document.documentElement.removeAttribute("data-app-theme");
  const eff = theme || (matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme")!=="light" ? "night" : "day");
  document.querySelectorAll("[data-set-theme]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.setTheme===eff));
}

/* ---------- speech out ---------- */
let speaking=false;
function spoken(s){
  return String(s).replace(/<[^>]+>/g," ")
    .replace(/O₂/g,"oxygen").replace(/CO₂/g,"C O 2").replace(/HCO₃/g,"bicarbonate").replace(/SpO₂/g,"saturation")
    .replace(/µg/g," micrograms").replace(/U\/h/g,"units per hour").replace(/mg PE/g,"milligram P E")
    .replace(/\/kg\/min/g," per kilo per minute").replace(/\/kg/g," per kilo").replace(/\/h\b/g," per hour").replace(/\/L/g," per litre")
    .replace(/(\d)\s?mg\b/g,"$1 milligrams").replace(/(\d)\s?ml\b/g,"$1 ml").replace(/(\d)\s?g\b/g,"$1 grams")
    .replace(/–/g," to ").replace(/≤/g," up to ").replace(/≥/g," at least ").replace(/</g," less than ").replace(/>/g," more than ")
    .replace(/→/g,", then ").replace(/×/g," times ").replace(/·/g,", ").replace(/\s+/g," ").trim();
}
function phaseText(p,i){
  const ph=p.phases[i];
  const parts=[`${ph.t}. ${ph.h}.`];
  ph.items.forEach(it=>{
    if(typeof it==="string") parts.push(it);
    else if(it.warn) parts.push("Warning. "+it.warn);
    else if(it.rec) parts.push(W?it.rec(W):"Enter weight to calculate.");
    else { const d=doseCalc(it); parts.push(`${it.d}: ${d.noW?d.rule:(d.calc||d.rule)}, ${it.r}${d.cap?", capped at maximum":""}.`); }
  });
  return spoken(parts.join(" "));
}
function say(text,onend){
  if(!("speechSynthesis" in window)) { status("Read-aloud isn't supported in this browser."); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-IN"; u.rate=0.95;
  speaking=true;
  u.onend=u.onerror=()=>{speaking=false; if(cur) renderProto(); onend&&onend();};
  speechSynthesis.speak(u);
}
function readPhase(i){
  const p=byId(cur); if(!p) return;
  if(i>=p.phases.length){ say("End of protocol."); return; }
  speakIdx=i; renderProto(); say(phaseText(p,i));
}
function stopSpeech(){ try{speechSynthesis.cancel()}catch(e){} speaking=false; }

/* ---------- speech in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, micOk=true;
function status(msg,heard){
  $("#vstat").innerHTML = msg + (heard?` <strong>Heard: “${esc(heard)}”</strong>`:"");
}
const HELP = "Say “open DKA”, “weight 12”, “read”, “next”, “repeat”, “home” or “stop”.";
function startRec(){
  if(!SR){ micOk=false; status("Voice commands aren't supported in this browser. Use the Read aloud buttons."); return; }
  rec = new SR(); rec.lang="en-IN"; rec.continuous=true; rec.interimResults=false;
  rec.onresult = e=>{ const t=e.results[e.results.length-1][0].transcript; handle(t); };
  rec.onerror = e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"){ micOk=false; status("Microphone is blocked. Allow mic access to use voice commands, or use the Read aloud buttons."); } };
  rec.onend = ()=>{ if(voiceOn&&micOk){ try{rec.start()}catch(e){} } };
  try{ rec.start(); status("Listening. "+HELP); }catch(e){ status("Couldn't start the microphone. Use the Read aloud buttons."); }
}
function stopRec(){ if(rec){ rec.onend=null; try{rec.stop()}catch(e){} rec=null; } }
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
function handle(raw){
  const t=raw.toLowerCase().trim();
  status("Listening. "+HELP, raw);
  if(/\b(stop|quiet|silence|pause)\b/.test(t)){ stopSpeech(); if(cur) renderProto(); return; }
  if(/weight|kilo|kg/.test(t)){
    let m=t.match(/(\d+(?:\.\d+)?)/), v=m?parseFloat(m[1]):null;
    if(v==null){ let s=0; t.split(/\s+/).forEach(x=>{ if(x in NUMW) s+=NUMW[x]; }); v=s||null; }
    if(v&&v>0&&v<=150){ setW(v); say(`Weight ${f(v)} kilos.`); } else say("Didn't catch the weight. Say weight, then a number.");
    return;
  }
  if(/\b(home|back|all conditions|menu)\b/.test(t)){ goHome(); say("Home."); return; }
  if(cur && /\b(next)\b/.test(t)){ readPhase(speakIdx+1); return; }
  if(cur && /\b(repeat|again)\b/.test(t)){ readPhase(speakIdx); return; }
  if(cur && /\b(read|dose|doses|start)\b/.test(t) && !findProto(t)){ readPhase(0); return; }
  const p=findProto(t);
  if(p){ openP(p.id); say(`${p.name}. ${W?`Weight ${f(W)} kilos.`:"Weight not set."} Say read to hear the doses.`); return; }
  say("Sorry, I didn't get that.");
}
function findProto(t){
  return P.find(p=>t.includes(p.name.toLowerCase())) || P.find(p=>KW[p.id].some(k=>new RegExp("\\b"+k+"\\b").test(t)));
}
function setVoice(on){
  voiceOn=on;
  $("#voiceBtn").setAttribute("aria-pressed",on); $("#voiceLbl").textContent = on?"Voice on":"Voice off";
  $("#vstat").classList.toggle("on",on); setBarH();
  if(on){ micOk=true; startRec(); } else { stopRec(); stopSpeech(); }
  if(cur) renderProto();
}

/* ---------- weight ---------- */
function setW(v){ W=v; wIn.value=v; save(); if(cur) renderProto(); }
wIn.addEventListener("input",()=>{const v=parseFloat(wIn.value); W = v>0&&v<=150?v:null; save(); if(cur) renderProto();});
const ages=[];
for(let m=0;m<12;m+=3) ages.push({l:`${m} mo`, w:0.5*m+4});
for(let y=1;y<=5;y++) ages.push({l:`${y} y`, w:2*y+8});
for(let y=6;y<=12;y++) ages.push({l:`${y} y`, w:3*y+7});
$("#age").innerHTML += ages.map((a,i)=>`<option value="${i}">${a.l} (~${a.w} kg)</option>`).join("");
$("#useEst").addEventListener("click",()=>{const i=$("#age").value; if(i!=="") setW(ages[i].w);});

/* ---------- events ---------- */
$("#q").addEventListener("input",renderHome);
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ openP(o.dataset.open); return; }
  if(e.target.closest("[data-home]")){ goHome(); return; }
  if(e.target.closest("[data-pin]")){ pins = pins.includes(cur)?pins.filter(x=>x!==cur):[...pins,cur]; save(); renderProto(); return; }
  const s=e.target.closest("[data-say]"); if(s){ readPhase(+s.dataset.say); return; }
  const th=e.target.closest("[data-set-theme]"); if(th){ theme=th.dataset.setTheme; save(); applyTheme(); return; }
});
$("#voiceBtn").addEventListener("click",()=>setVoice(!voiceOn));

function save(){ try{ localStorage.setItem("perc",JSON.stringify({W,pins,theme})) }catch(e){} }
try{ const s=JSON.parse(localStorage.getItem("perc")||"null");
  if(s){ if(s.W){W=s.W; wIn.value=s.W} if(Array.isArray(s.pins)) pins=s.pins; if(s.theme) theme=s.theme; } }catch(e){}
applyTheme();
setBarH();
show("home");
if("serviceWorker" in navigator) addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
</script>
</body>
</html>
